[firefly_interface]
# paste your firefly base url here
base_url = "http://your-firefly-instance"
# paste your firefly api token here
api_token = "your-api-token-here"
duplicate_transaction = "ignore"  # options: "error", "ignore"

# Optional bill-aware enrichment. Enrichment stays off until `directory` is set
# (or `--bills_directory` is passed to `cash transfer`).
[bills]
# folder that holds the dropped bills (PDF invoices, receipts, scans or photos)
# Accepted formats: .pdf, .png, .jpg, .jpeg, .webp, .heic, .heif
# HEIC/HEIF photos (iPhone) are transcoded to JPEG locally.
# Requires: pip install "firefly-cash-converter[heic]"
# directory = "./bills"
# max day gap between bill and transaction dates
date_window_days = 14
# allowed difference between bill total and transaction amount
amount_tolerance = 0.0
# minimum vendor similarity for a match (0.0 - 1.0)
vendor_threshold = 0.6
# below this, the category, account and tags are left empty
confidence_threshold = 0.5
# audit tag written onto enriched transactions
marker_tag = "bill-matched"
# archive applied bills after a run
move_processed = true
# subfolder applied bills are moved into
processed_subdir = "processed"
# where the Markdown report is written
report_path = "./bills-report.md"
# allow sending bills (scans and photos) to the vision model
vision = true
# PDF pages considered for text extraction
max_pages = 1
# let bills also set the transaction's counter-account (only filled when empty)
accounts = true

# Local OpenAI-compatible LLM (e.g. llama-server from llama.cpp).
[llm]
base_url = "http://127.0.0.1:1234/v1"
model = "your-local-model"
timeout_s = 120
